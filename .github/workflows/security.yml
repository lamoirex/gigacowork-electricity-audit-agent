name: security
on:
  push: { branches: [main] }
  schedule:
    - cron: "0 6 * * 1"
jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install bandit
      - run: bandit -r agent -ll
